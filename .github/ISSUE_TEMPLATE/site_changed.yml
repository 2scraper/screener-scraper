name: Site changed / selectors broke
description: screener.in changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        screener.in moved.

        Useful to know before filing: the parser reads the **results table**
        in the served HTML. A row is `<tr data-row-company-id="...">`, a column
        is identified by its header's `data-tooltip` (the site's own metric
        name, e.g. "Market Capitalization") and its unit, and the page's own
        `<div data-page-info>` ("164 results found: Showing page 1 of 7") is
        what decides pagination. A column whose name or unit changed lands in
        `extra_metrics` rather than in its usual column, and the run logs a
        warning saying so.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Rows (0 rows on a page that visibly has a results table)
        - A specific column is null or wrong (price, market cap, P/E, ...)
        - Pagination stops early, repeats a page, or the run reports
          "pagination_not_addressable"
        - A page is classified as blocked / not found when it is not
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact screen or sector URL you ran.
      placeholder: "https://www.screener.in/market/IN08/IN0801/IN080101/"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - Run with `--dump-html dump.html`, then:
          `python3 -c "import product_parser as p; h=open('dump.html').read(); print(p.page_info(h), p.count_cards(h))"`
          — that is ((results, page served, pages), rows found).
        - For a column problem: the value you got, and the value on the page.
        - Please strip the `csrfmiddlewaretoken` value from any HTML you paste.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, and when it last worked.
