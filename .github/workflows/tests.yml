name: tests

# Offline only. Nothing here touches screener.in, 2captcha.com or a credential:
# GitHub Actions has no key, and a CI job that hits a live site fails for
# reasons that have nothing to do with the commit. The live half is canary.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported Python. Claiming 3.9 without testing
        # it is how a walrus operator or an `X | None` annotation ships broken.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile everything
        # Catches a syntax error on the oldest supported Python before the
        # suite gets a chance to skip the file.
        run: python -m compileall -q .

      - name: Offline test suite
        # Prints its own count. No network, no key, ~2s.
        run: python smoke_test.py

      - name: Offline test suite, via pytest
        # tests/test_smoke.py wraps the same run for the pytest entry point
        # pyproject.toml declares — this step exists so THAT wrapper cannot
        # silently rot even though the line above already covers the checks.
        run: |
          pip install pytest
          pytest -q

      # One implementation of these checks, invoked from CI and from the
      # offline suite alike. smoke_test.py asserts that this step calls the
      # script rather than reimplementing a narrower version of it inline —
      # which is exactly how the family ended up with two sources of truth,
      # one dead and one with a hole in it.
      - name: Repo checks (CLI --help, committed sample, no secrets)
        run: python .github/ci_checks.py --all

      - name: Config reporter runs with no .env present
        run: python env_config.py

      - name: The committed fixtures are what make_fixtures.py would build
        # The raw captures are not in the repo, so this cannot REBUILD them
        # here; it checks the committed file parses and that the suite read
        # it, which the offline suite above already failed on if it did not.
        run: python -c "import json; f=json.load(open('fixtures_generated.json')); assert len(f) >= 10, len(f); print(len(f), 'fixtures')"

  engine-smoke:
    # The job above installs NO engine library on purpose, which means every
    # engine-guarded check in smoke_test.py silently skips there — and
    # "skipped, engine absent" reads identically to a real import error.
    #
    # ONE VENV PER ENGINE, from its own requirements file: the three engines'
    # pins are mutually unsatisfiable, so installing all three into one
    # environment lets pip resolve the conflict by reaching for whatever it
    # can — on another repo in this family that meant pyppeteer 0.0.25, a
    # stub, and a green CI against a version the repo does not support.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [playwright, puppeteer, selenium]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + this engine, in their own venv
        run: |
          python -m venv .venv-${{ matrix.engine }}
          . .venv-${{ matrix.engine }}/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-${{ matrix.engine }}.txt
          # Proves each requirements file is self-consistent on its own.
          pip check

      - name: The suite, with THIS engine importable
        # The other two are absent by design, so the suite will report skips
        # for them; what must NOT happen is this engine's group skipping.
        run: |
          set -e
          . .venv-${{ matrix.engine }}/bin/activate
          case "${{ matrix.engine }}" in
            playwright) module=playwright_scraper ;;
            puppeteer)  module=puppeteer_scraper ;;
            selenium)   module=selenium_scraper ;;
          esac
          python smoke_test.py | tee smoke.log
          if grep -q "SKIPPED.*$module" smoke.log; then
            echo "FAILED: $module reported skipped although ${{ matrix.engine }} is installed in this job — likely a real import error."
            exit 1
          fi
          python "$module.py" --help > /dev/null

  docker:
    # Nothing else builds the image, which is how every repo in this family
    # once shipped one that died with ModuleNotFoundError on every
    # invocation, --help included. Four steps, each for a distinct failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t screener-scraper:ci .

      - name: Its entrypoint runs
        # CMD is --help: the exact invocation a missing module breaks.
        run: docker run --rm screener-scraper:ci

      - name: Chromium really launches inside it
        # `playwright install --with-deps` exiting 0 is not the same as a
        # browser that starts.
        run: |
          docker run --rm --entrypoint python3 screener-scraper:ci -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              print('chromium', b.version)
              b.close()"

      - name: The image carries no .env, no tests and no fixtures
        # A .env baked into an image is a credential published to everyone who
        # can pull it.
        run: |
          set -e
          listing=$(docker run --rm --entrypoint sh screener-scraper:ci -c "ls -a /app")
          echo "$listing"
          for unwanted in .env smoke_test.py captures tests fixtures_generated.json make_fixtures.py; do
            if echo "$listing" | grep -qx "$unwanted"; then
              echo "FAILED: /app/$unwanted is in the image"
              exit 1
            fi
          done
